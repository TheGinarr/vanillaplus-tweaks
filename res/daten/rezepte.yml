# MasterCutter (CC-BY-ND-4.0) und Gardener's Dream (All Rights Reserved) duerfen nicht als
# bearbeitete Fassung veroeffentlicht werden. Die vollstaendige Datei erzeugt man lokal mit
#   python3 konverter/rezepte_konvertieren.py <ordner-mit-den-packs> res/daten/rezepte.yml
# aus den selbst heruntergeladenen Original-Packs (siehe README).

